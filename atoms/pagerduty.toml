# atoms/pagerduty.toml — SRE channel atom: PagerDuty
#
# Typed channel for the PagerDuty Events and REST APIs.
# Direction: outbound (agent sends alerts, creates incidents, and acknowledges).
# Encoding: json (PagerDuty API v2 uses JSON).
#
# Conforms to: channel-atoms catalog spec (atoms-spec/v1.1.0)

id           = "channel-atoms/channel/pagerduty"
version      = "1.0.0"
content_hash = ""
lifecycle    = "draft"
created_at   = "2026-05-26T00:00:00Z"

[body]
name                = "PagerDuty"
description         = "Outbound alert and incident management channel for PagerDuty Events API v2 and REST API v2 — trigger alerts, acknowledge incidents, resolve events, and escalate on-call."
type                = "pagerduty"
direction           = "outbound"
encoding            = "json"
protocol_ref        = "channel-atoms/protocol/https"
auth_method_ref     = "channel-atoms/auth-method/api-key"
transport_ref       = "channel-atoms/transport/push-sync"
delivery_ref        = "channel-atoms/delivery-semantic/at-least-once"
endpoint_template   = "https://events.pagerduty.com/v2/enqueue"
encryption_required = true
timeout_seconds     = 30
max_payload_bytes   = 524288

[body.slot_types]
pagerduty_integration_key = "secret-string"
pagerduty_api_token       = "secret-string"
pagerduty_service_id      = "secret-string"

[body.operations]
safe     = ["get-incident", "list-incidents", "get-oncall", "list-services"]
mutating = ["trigger-alert", "acknowledge", "resolve", "create-incident", "escalate"]

[body.tags]
tags = ["sre", "alerting", "incident", "pagerduty", "outbound", "on-call"]

[meta]
provenance = "https://developer.pagerduty.com/api-reference/"
license    = "Apache-2.0"
