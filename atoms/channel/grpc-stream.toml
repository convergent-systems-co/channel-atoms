# atoms/channel/grpc-stream.toml — Olympus provider channel: gRPC bidirectional streaming
#
# Typed channel for gRPC bidirectional streaming RPCs.
# Direction: duplex (client and server both stream messages concurrently).
# Encoding: protobuf (binary Protocol Buffers serialization).
#
# Conforms to: channel-atoms catalog spec (atoms-spec/v1.1.0)

id           = "channel-atoms/channel/grpc-stream"
version      = "1.0.0"
content_hash = ""
lifecycle    = "draft"
created_at   = "2026-05-26T00:00:00Z"

[body]
name                = "gRPC Stream"
description         = "gRPC bidirectional streaming channel — both client and server send streams of protobuf messages over HTTP/2. Used for high-throughput Olympus tool-call pipelines."
type                = "grpc"
direction           = "duplex"
encoding            = "protobuf"
protocol_ref        = "channel-atoms/protocol/grpc"
auth_method_ref     = "channel-atoms/auth-method/bearer-token"
transport_ref       = "channel-atoms/transport/push-sync"
delivery_ref        = "channel-atoms/delivery-semantic/at-most-once"
endpoint_template   = "grpcs://{host}:{port}"
encryption_required = true
timeout_seconds     = 0
max_payload_bytes   = 4194304

[body.slot_types]
bearer_token = "secret-string"
host         = "string"
port         = "integer"
service_name = "string"
method_name  = "string"

[body.operations]
safe     = ["server-stream", "client-stream"]
mutating = ["bidi-stream", "unary"]

[body.tags]
tags = ["grpc", "protobuf", "streaming", "http2", "duplex", "olympus"]

[meta]
provenance = "https://grpc.io/docs/what-is-grpc/core-concepts/"
license    = "Apache-2.0"
