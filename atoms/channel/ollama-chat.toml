# atoms/channel/ollama-chat.toml — Olympus provider channel: Ollama chat backend
#
# Typed channel for a local Ollama inference server.
# Direction: duplex (agent sends chat requests and receives completions).
# Encoding: json (Ollama API uses JSON request and response bodies).
#
# Conforms to: channel-atoms catalog spec (atoms-spec/v1.1.0)

id           = "channel-atoms/channel/ollama-chat"
version      = "1.0.0"
content_hash = ""
lifecycle    = "draft"
created_at   = "2026-05-26T00:00:00Z"

[body]
name                = "Ollama Chat"
description         = "Duplex HTTP channel for a local Ollama inference server — send chat messages and receive completions. Unauthenticated; local-network use only."
type                = "ollama"
direction           = "duplex"
encoding            = "json"
protocol_ref        = "channel-atoms/protocol/http"
auth_method_ref     = "channel-atoms/auth-method/none"
transport_ref       = "channel-atoms/transport/push-sync"
delivery_ref        = "channel-atoms/delivery-semantic/at-most-once"
endpoint_template   = "http://localhost:11434"
encryption_required = false
timeout_seconds     = 120
max_payload_bytes   = 131072

[body.slot_types]
model = "string"
host  = "string"
port  = "integer"

[body.operations]
safe     = ["list-models", "show-model-info"]
mutating = ["chat", "generate", "pull-model"]

[body.tags]
tags = ["ai", "llm", "ollama", "local", "olympus", "duplex"]

[meta]
provenance = "https://ollama.com/blog/openai-compatibility"
license    = "Apache-2.0"
