# atoms/channel/stdio-pipe.toml — Olympus provider channel: stdio pipe (subprocess)
#
# Typed channel for communicating with subprocesses via stdin/stdout pipes.
# Direction: duplex (agent writes to stdin, reads from stdout/stderr).
# Encoding: text (newline-delimited plain text or JSON-lines).
#
# Conforms to: channel-atoms catalog spec (atoms-spec/v1.1.0)

id           = "channel-atoms/channel/stdio-pipe"
version      = "1.0.0"
content_hash = ""
lifecycle    = "draft"
created_at   = "2026-05-26T00:00:00Z"

[body]
name                = "Stdio Pipe"
description         = "Duplex stdio pipe channel — agent communicates with a subprocess via stdin/stdout. Used by Olympus for tool executors that run as child processes (e.g., MCP servers, CLI tools)."
type                = "stdio"
direction           = "duplex"
encoding            = "text"
protocol_ref        = "channel-atoms/protocol/stdio"
auth_method_ref     = "channel-atoms/auth-method/none"
transport_ref       = "channel-atoms/transport/push-sync"
delivery_ref        = "channel-atoms/delivery-semantic/at-most-once"
endpoint_template   = "{command}"
encryption_required = false
timeout_seconds     = 60

[body.slot_types]
command = "string"
args    = "string"
cwd     = "file-path"
env     = "string"

[body.operations]
safe     = ["read-stdout", "read-stderr"]
mutating = ["write-stdin", "spawn", "kill"]

[body.tags]
tags = ["stdio", "subprocess", "pipe", "duplex", "mcp", "olympus"]

[meta]
provenance = "https://modelcontextprotocol.io/docs/concepts/transports"
license    = "Apache-2.0"
