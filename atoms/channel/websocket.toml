# atoms/channel/websocket.toml — Olympus provider channel: WebSocket full-duplex
#
# Typed channel for WebSocket connections.
# Direction: duplex (full-duplex bidirectional messaging over a persistent connection).
# Encoding: json (structured JSON frames).
#
# Conforms to: channel-atoms catalog spec (atoms-spec/v1.1.0)

id           = "channel-atoms/channel/websocket"
version      = "1.0.0"
content_hash = ""
lifecycle    = "draft"
created_at   = "2026-05-26T00:00:00Z"

[body]
name                = "WebSocket"
description         = "Full-duplex WebSocket channel — persistent connection with low-latency bidirectional JSON message passing. Used by Olympus for real-time tool-call streaming."
type                = "websocket"
direction           = "duplex"
encoding            = "json"
protocol_ref        = "channel-atoms/protocol/websocket"
auth_method_ref     = "channel-atoms/auth-method/bearer-token"
transport_ref       = "channel-atoms/transport/push-sync"
delivery_ref        = "channel-atoms/delivery-semantic/at-most-once"
endpoint_template   = "wss://{host}/{path}"
encryption_required = true
timeout_seconds     = 0
max_payload_bytes   = 262144

[body.slot_types]
bearer_token = "secret-string"
host         = "string"
path         = "string"

[body.operations]
safe     = ["receive"]
mutating = ["send", "connect", "disconnect"]

[body.tags]
tags = ["websocket", "streaming", "realtime", "duplex", "olympus"]

[meta]
provenance = "https://www.rfc-editor.org/rfc/rfc6455"
license    = "Apache-2.0"
