# atoms/prometheus.toml — SRE channel atom: Prometheus
#
# Typed channel for the Prometheus query and alerting API.
# Direction: inbound (agent queries Prometheus for metrics and alerts).
# Encoding: json (Prometheus HTTP API v1 returns JSON).
#
# Conforms to: channel-atoms catalog spec (atoms-spec/v1.1.0)

id           = "channel-atoms/channel/prometheus"
version      = "1.0.0"
content_hash = ""
lifecycle    = "draft"
created_at   = "2026-05-26T00:00:00Z"

[body]
name                = "Prometheus"
description         = "Inbound query channel for Prometheus HTTP API v1 — metrics, instant queries, range queries, and alert rules."
type                = "prometheus"
direction           = "inbound"
encoding            = "json"
protocol_ref        = "channel-atoms/protocol/https"
auth_method_ref     = "channel-atoms/auth-method/bearer-token"
transport_ref       = "channel-atoms/transport/push-sync"
delivery_ref        = "channel-atoms/delivery-semantic/at-most-once"
endpoint_template   = "https://{prometheus_host}/api/v1"
encryption_required = true
timeout_seconds     = 30
max_payload_bytes   = 0

[body.slot_types]
prometheus_host      = "secret-string"
prometheus_token     = "secret-string"

[body.operations]
safe    = ["query", "query_range", "series", "labels", "label_values", "rules", "alerts", "targets"]
mutating = []

[body.tags]
tags = ["sre", "observability", "metrics", "prometheus", "inbound"]

[meta]
provenance = "https://prometheus.io/docs/prometheus/latest/querying/api/"
license    = "Apache-2.0"
