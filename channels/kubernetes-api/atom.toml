[channel]
name                = "Kubernetes API"
description         = "Kubernetes REST API channel — credentials sourced from kubeconfig"
protocol_ref        = "channel-atoms/protocol/k8s-api"
auth_method_ref     = "channel-atoms/auth-method/kubeconfig"
